<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigma Invo - Studio Manager</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide-react"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <style>
        @media print { .no-print { display: none !important; } .print-area { display: block !important; background: white !important; color: black !important; width: 100% !important; } body { background: white; } }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-950">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const Lucide = lucideReact;

        // Firebase Configuration from your 'new.txt'
        const firebaseConfig = {
            apiKey: "AIzaSyB3X7v-yLpE2-tSlate-400-size", 
            authDomain: "sigma-invo.firebaseapp.com",
            projectId: "sigma-invo",
            storageBucket: "sigma-invo.appspot.com",
            messagingSenderId: "389274383502",
            appId: "1:389274383502:web:6e387c978385802"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();
        const auth = firebase.auth();

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [inventory, setInventory] = useState([]);
            const [invoices, setInvoices] = useState([]);
            const [loading, setLoading] = useState(true);
            const [cart, setCart] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [client, setClient] = useState({ name: '', phone: '' });

            const settings = {
                studioName: 'SIGMA LENS STUDIO',
                location: 'Salalah, Oman',
                currency: 'OMR',
                phone: '+968 78385802'
            };

            useEffect(() => {
                const unsub = auth.onAuthStateChanged(user => {
                    if (user) {
                        db.collection('inventory').onSnapshot(s => setInventory(s.docs.map(d => ({id: d.id, ...d.data()}))));
                        db.collection('invoices').onSnapshot(s => setInvoices(s.docs.map(d => ({id: d.id, ...d.data()}))));
                        setLoading(false);
                    } else { auth.signInAnonymously(); }
                });
                return unsub;
            }, []);

            const total = cart.reduce((sum, item) => sum + (Number(item.price) || 0), 0);

            if (loading) return <div className="h-screen flex items-center justify-center text-white font-bold tracking-widest bg-slate-950">SIGMA MANAGER LOADING...</div>;

            return (
                <div className="flex h-screen bg-slate-950 text-slate-200 font-sans overflow-hidden">
                    {/* SIDEBAR - ORIGINAL DESIGN */}
                    <aside className="w-64 bg-slate-900 border-r border-slate-800 flex flex-col no-print">
                        <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                            <Lucide.Camera className="text-blue-500" />
                            <span className="font-black text-lg tracking-tighter">SIGMA INVO</span>
                        </div>
                        <nav className="flex-1 p-4 space-y-2">
                            <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl ${activeTab === 'dashboard' ? 'bg-blue-600' : 'hover:bg-slate-800 text-slate-400'}`}><Lucide.LayoutDashboard size={18}/> Dashboard</button>
                            <button onClick={() => setActiveTab('billing')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl ${activeTab === 'billing' ? 'bg-blue-600' : 'hover:bg-slate-800 text-slate-400'}`}><Lucide.ShoppingCart size={18}/> Billing</button>
                            <button onClick={() => setActiveTab('inventory')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl ${activeTab === 'inventory' ? 'bg-blue-600' : 'hover:bg-slate-800 text-slate-400'}`}><Lucide.Package size={18}/> Inventory</button>
                        </nav>
                    </aside>

                    {/* MAIN CONTENT */}
                    <main className="flex-1 overflow-y-auto p-8 no-print">
                        {activeTab === 'dashboard' && (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div className="bg-slate-900 p-6 rounded-3xl border border-slate-800">
                                    <Lucide.TrendingUp className="text-blue-500 mb-4" />
                                    <p className="text-xs text-slate-500 font-bold uppercase">Total Revenue</p>
                                    <h3 className="text-3xl font-black mt-1">{invoices.reduce((a,b) => a + (b.total || 0), 0).toFixed(3)} OMR</h3>
                                </div>
                                <div className="bg-slate-900 p-6 rounded-3xl border border-slate-800">
                                    <Lucide.Package className="text-purple-500 mb-4" />
                                    <p className="text-xs text-slate-500 font-bold uppercase">Inventory</p>
                                    <h3 className="text-3xl font-black mt-1">{inventory.length} Items</h3>
                                </div>
                            </div>
                        )}

                        {activeTab === 'inventory' && (
                            <div className="space-y-4">
                                <div className="flex justify-between bg-slate-900 p-4 rounded-2xl border border-slate-800">
                                    <input type="text" placeholder="Search gear..." className="bg-transparent outline-none w-full" onChange={(e) => setSearchTerm(e.target.value)} />
                                    <button className="bg-blue-600 px-6 py-2 rounded-xl font-bold">Add Item</button>
                                </div>
                                <div className="bg-slate-900 rounded-3xl border border-slate-800 overflow-hidden">
                                    <table className="w-full text-left">
                                        <thead className="bg-slate-800/50 text-xs font-bold text-slate-500 uppercase">
                                            <tr><th className="p-6">Description</th><th className="p-6 text-right">Price</th></tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-800">
                                            {inventory.filter(i => i.name?.toLowerCase().includes(searchTerm.toLowerCase())).map(item => (
                                                <tr key={item.id} className="hover:bg-slate-800/20 transition">
                                                    <td className="p-6 font-bold">{item.name}</td>
                                                    <td className="p-6 text-right font-bold text-blue-400">{item.price}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {activeTab === 'billing' && (
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                <div className="space-y-6">
                                    <div className="bg-slate-900 p-8 rounded-[2rem] border border-slate-800">
                                        <h3 className="text-blue-500 font-black text-xs uppercase mb-6">Client Info</h3>
                                        <div className="grid gap-4">
                                            <input type="text" placeholder="Client Name" className="bg-slate-950 border border-slate-800 p-4 rounded-2xl outline-none" onChange={(e) => setClient({...client, name: e.target.value})} />
                                            <input type="text" placeholder="Phone" className="bg-slate-950 border border-slate-800 p-4 rounded-2xl outline-none" onChange={(e) => setClient({...client, phone: e.target.value})} />
                                        </div>
                                    </div>
                                    <div className="bg-slate-900 p-8 rounded-[2rem] border border-slate-800 h-96 overflow-y-auto">
                                        <h3 className="text-purple-500 font-black text-xs uppercase mb-6">Select Gear</h3>
                                        {inventory.map(item => (
                                            <button key={item.id} onClick={() => setCart([...cart, {...item, cid: Date.now()}])} className="w-full flex justify-between p-4 mb-2 bg-slate-950 rounded-2xl border border-slate-800 hover:border-blue-600 transition">
                                                <span>{item.name}</span><span className="font-bold text-blue-400">{item.price}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* INVOICE PREVIEW */}
                                <div className="bg-white text-slate-900 p-10 rounded-[2.5rem] shadow-2xl h-fit">
                                    <div className="flex justify-between border-b-2 pb-6 mb-6">
                                        <h1 className="text-2xl font-black italic">SIGMA STUDIO</h1>
                                        <div className="text-right"><h2 className="font-bold text-slate-300">INVOICE</h2><p className="text-xs font-bold">{new Date().toLocaleDateString()}</p></div>
                                    </div>
                                    <div className="mb-6"><p className="text-[10px] font-bold text-slate-400">BILL TO:</p><p className="text-xl font-black">{client.name || 'CASH CUSTOMER'}</p></div>
                                    <table className="w-full mb-8">
                                        <tr className="border-b text-[10px] text-slate-400 font-bold uppercase"><th className="py-2 text-left">Item</th><th className="py-2 text-right">Price</th></tr>
                                        {cart.map((c,i) => <tr key={i} className="border-b"><td className="py-3 font-bold">{c.name}</td><td className="py-3 text-right font-bold">{c.price}</td></tr>)}
                                    </table>
                                    <div className="flex justify-between pt-4 border-t-2"><span className="font-bold text-slate-400">TOTAL OMR</span><span className="text-3xl font-black text-blue-600">{total.toFixed(3)}</span></div>
                                    <button onClick={() => window.print()} className="w-full mt-8 bg-slate-900 text-white py-4 rounded-2xl font-bold uppercase hover:bg-blue-600 transition">Print Bill</button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
