<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigma Invo - Studio Manager</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide-react"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <style>
        @media print { .no-print { display: none !important; } .a4-container { width: 100% !important; box-shadow: none !important; border: none !important; } }
        body { background-color: #020617; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const Lucide = lucideReact;

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB3X7v-yLpE2-tSlate-400-size", 
            authDomain: "sigma-invo.firebaseapp.com",
            projectId: "sigma-invo",
            storageBucket: "sigma-invo.appspot.com",
            messagingSenderId: "389274383502",
            appId: "1:389274383502:web:6e387c978385802"
        };

        // Initialize
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();
        const auth = firebase.auth();

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [inventory, setInventory] = useState([]);
            const [invoices, setInvoices] = useState([]);
            const [cart, setCart] = useState([]);
            const [client, setClient] = useState({ name: '', phone: '' });
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                auth.onAuthStateChanged(user => {
                    if (user) {
                        db.collection('inventory').onSnapshot(s => setInventory(s.docs.map(d => ({id: d.id, ...d.data()}))));
                        db.collection('invoices').onSnapshot(s => setInvoices(s.docs.map(d => ({id: d.id, ...d.data()}))));
                        setLoading(false);
                    } else { auth.signInAnonymously(); }
                });
            }, []);

            if (loading) return <div className="h-screen flex items-center justify-center text-blue-500 font-bold bg-slate-950">SIGMA LOADING...</div>;

            return (
                <div className="flex h-screen bg-slate-950 text-slate-200 overflow-hidden">
                    {/* Sidebar */}
                    <aside className="w-64 bg-slate-900 border-r border-slate-800 flex flex-col no-print">
                        <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                            <Lucide.Camera className="text-blue-500" size={24} />
                            <span className="font-black text-xl tracking-tighter">SIGMA STUDIO</span>
                        </div>
                        <nav className="flex-1 p-4 space-y-2">
                            <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition ${activeTab === 'dashboard' ? 'bg-blue-600 text-white' : 'hover:bg-slate-800 text-slate-400'}`}><Lucide.LayoutDashboard size={20}/> Dashboard</button>
                            <button onClick={() => setActiveTab('billing')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition ${activeTab === 'billing' ? 'bg-blue-600 text-white' : 'hover:bg-slate-800 text-slate-400'}`}><Lucide.ShoppingCart size={20}/> New Bill</button>
                            <button onClick={() => setActiveTab('inventory')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition ${activeTab === 'inventory' ? 'bg-blue-600 text-white' : 'hover:bg-slate-800 text-slate-400'}`}><Lucide.Package size={20}/> Inventory</button>
                        </nav>
                    </aside>

                    {/* Content */}
                    <main className="flex-1 overflow-y-auto p-8 custom-scroll no-print">
                        {activeTab === 'dashboard' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-4xl">
                                <div className="bg-slate-900 p-8 rounded-3xl border border-slate-800 shadow-2xl">
                                    <Lucide.TrendingUp className="text-blue-500 mb-4" />
                                    <h3 className="text-slate-500 text-xs font-bold uppercase tracking-widest">Total Sales</h3>
                                    <p className="text-4xl font-black mt-2 text-white">{invoices.reduce((a,b) => a + (b.total || 0), 0).toFixed(3)} OMR</p>
                                </div>
                                <div className="bg-slate-900 p-8 rounded-3xl border border-slate-800 shadow-2xl">
                                    <Lucide.Package className="text-purple-500 mb-4" />
                                    <h3 className="text-slate-500 text-xs font-bold uppercase tracking-widest">Gear Count</h3>
                                    <p className="text-4xl font-black mt-2 text-white">{inventory.length} Items</p>
                                </div>
                            </div>
                        )}

                        {activeTab === 'inventory' && (
                            <div className="bg-slate-900 rounded-3xl border border-slate-800 overflow-hidden shadow-2xl max-w-5xl">
                                <table className="w-full text-left">
                                    <thead className="bg-slate-800 text-slate-400 text-xs font-bold uppercase tracking-widest">
                                        <tr><th className="p-6">Description</th><th className="p-6 text-right">Rate</th></tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-800">
                                        {inventory.map(item => (
                                            <tr key={item.id} className="hover:bg-slate-800/30 transition">
                                                <td className="p-6 font-bold">{item.name}</td>
                                                <td className="p-6 text-right font-mono text-blue-400 font-bold">{item.price}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {activeTab === 'billing' && (
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-10 max-w-7xl">
                                <div className="space-y-6">
                                    <div className="bg-slate-900 p-8 rounded-[2.5rem] border border-slate-800 shadow-xl">
                                        <h4 className="text-blue-500 font-bold text-xs uppercase mb-4 tracking-widest">Customer</h4>
                                        <input type="text" placeholder="Name" className="w-full bg-slate-950 border border-slate-800 p-4 rounded-2xl mb-4 outline-none focus:border-blue-600 transition" onChange={(e)=>setClient({...client, name: e.target.value})} />
                                        <input type="text" placeholder="Phone" className="w-full bg-slate-950 border border-slate-800 p-4 rounded-2xl outline-none focus:border-blue-600 transition" onChange={(e)=>setClient({...client, phone: e.target.value})} />
                                    </div>
                                    <div className="bg-slate-900 p-8 rounded-[2.5rem] border border-slate-800 h-96 overflow-y-auto custom-scroll">
                                        <h4 className="text-purple-500 font-bold text-xs uppercase mb-4 tracking-widest">Add Gear</h4>
                                        {inventory.map(item => (
                                            <button key={item.id} onClick={()=>setCart([...cart, {...item, cid:Date.now()}])} className="w-full flex justify-between p-4 mb-2 bg-slate-950 rounded-2xl border border-slate-800 hover:border-blue-600 transition">
                                                <span className="font-medium">{item.name}</span>
                                                <span className="text-blue-400 font-bold">{item.price}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Preview */}
                                <div className="bg-white text-slate-900 p-10 rounded-[3rem] shadow-2xl h-fit border border-slate-100 a4-container">
                                    <div className="flex justify-between border-b-2 border-slate-100 pb-8 mb-8">
                                        <div><h1 className="text-2xl font-black italic tracking-tighter">SIGMA LENS</h1><p className="text-[10px] text-slate-400 font-bold tracking-widest uppercase">Salalah, Oman</p></div>
                                        <div className="text-right"><h2 className="text-3xl font-black text-slate-100 mb-1">INVOICE</h2><p className="text-xs font-bold text-slate-500">{new Date().toLocaleDateString()}</p></div>
                                    </div>
                                    <div className="mb-8"><p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Bill To:</p><p className="text-xl font-black">{client.name || 'CASH CUSTOMER'}</p><p className="text-sm font-bold text-slate-500">{client.phone}</p></div>
                                    <table className="w-full mb-8">
                                        <thead><tr className="border-b border-slate-100 text-[10px] text-slate-400 font-bold uppercase"><th className="py-4 text-left">Description</th><th className="py-4 text-right">Price</th></tr></thead>
                                        <tbody>
                                            {cart.map((c,i)=>(<tr key={i} className="border-b border-slate-50"><td className="py-4 font-bold text-slate-700">{c.name}</td><td className="py-4 text-right font-bold text-slate-900">{c.price}</td></tr>))}
                                        </tbody>
                                    </table>
                                    <div className="flex justify-between items-center border-t-2 border-slate-100 pt-8">
                                        <span className="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em]">Total OMR</span>
                                        <span className="text-4xl font-black text-blue-600">{cart.reduce((s,i)=>s+Number(i.price),0).toFixed(3)}</span>
                                    </div>
                                    <button onClick={()=>window.print()} className="w-full mt-10 bg-slate-900 text-white py-5 rounded-2xl font-bold uppercase hover:bg-blue-600 transition shadow-xl printhidden">Print Official Bill</button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
