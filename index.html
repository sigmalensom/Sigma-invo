<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigma Invo - Advanced Manager</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide-react"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <style>
        @media print { .printhidden { display: none !important; } .a4-container { width: 100% !important; max-width: none !important; padding: 0 !important; margin: 0 !important; box-shadow: none !important; border: none !important; } }
        body { -webkit-print-color-adjust: exact; }
    </style>
</head>
<body class="bg-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const Lucide = lucideReact;

        // Configuration using your keys
        const firebase_config = {
            apiKey: "AIzaSyB3X7v-yLpE2-tSlate-400-size", 
            authDomain: "sigma-invo.firebaseapp.com",
            projectId: "sigma-invo",
            storageBucket: "sigma-invo.appspot.com",
            messagingSenderId: "389274383502",
            appId: "1:389274383502:web:6e387c978385802"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebase_config); }
        const db = firebase.firestore();
        const auth = firebase.auth();

        function App() {
            // --- IVIDE NINGALUDE 'NEW.TXT'-ILE FULL CODE LOGIC VARUNNU ---
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [inventory, setInventory] = useState([]);
            const [invoices, setInvoices] = useState([]);
            const [settings, setSettings] = useState({
                studioName: 'AL ZABINA TRADING ESTABLISHMENT',
                senderName: 'SIGMA LENS STUDIO',
                address: 'SAHALNOOTH AL JANUBIYYAH',
                location: 'Salalah, Oman',
                email: 'contact@alzabina.com',
                vatNumber: '1426202',
                currency: 'OMR',
                phone: '+968 78385802'
            });

            // Auth & Data Sync
            useEffect(() => {
                auth.onAuthStateChanged((u) => {
                    if (u) {
                        setUser(u);
                        db.collection('inventory').onSnapshot(s => setInventory(s.docs.map(d => ({id: d.id, ...d.data()}))));
                        db.collection('invoices').onSnapshot(s => setInvoices(s.docs.map(d => ({id: d.id, ...d.data()}))));
                        setLoading(false);
                    } else { auth.signInAnonymously(); }
                });
            }, []);

            if (loading) return <div className="h-screen w-full flex items-center justify-center text-white font-sans bg-slate-900">Loading Sigma Invo...</div>;

            return (
                <div className="flex h-screen bg-slate-50 text-slate-800 font-sans antialiased overflow-hidden">
                    {/* Sidebar */}
                    <aside className="w-64 bg-slate-900 text-white flex flex-col printhidden">
                        <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                            <Lucide.Camera className="text-blue-500" size={24} />
                            <h1 className="text-lg font-bold uppercase tracking-tight">{settings.senderName}</h1>
                        </div>
                        <nav className="flex-1 p-4 space-y-2">
                            <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl ${activeTab === 'dashboard' ? 'bg-blue-600' : 'hover:bg-slate-800'}`}>
                                <Lucide.LayoutDashboard size={20} /> Dashboard
                            </button>
                            <button onClick={() => setActiveTab('billing')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl ${activeTab === 'billing' ? 'bg-blue-600' : 'hover:bg-slate-800'}`}>
                                <Lucide.ShoppingCart size={20} /> Create Bill
                            </button>
                            <button onClick={() => setActiveTab('inventory')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl ${activeTab === 'inventory' ? 'bg-blue-600' : 'hover:bg-slate-800'}`}>
                                <Lucide.Package size={20} /> Inventory
                            </button>
                            <button onClick={() => setActiveTab('invoices')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl ${activeTab === 'invoices' ? 'bg-blue-600' : 'hover:bg-slate-800'}`}>
                                <Lucide.FileText size={20} /> Invoices
                            </button>
                        </nav>
                    </aside>

                    {/* Main Content Area */}
                    <main className="flex-1 flex flex-col overflow-hidden relative">
                        <header className="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 printhidden">
                            <h2 className="text-xl font-semibold capitalize">{activeTab}</h2>
                            <div className="flex items-center gap-4">
                                <span className="text-sm text-slate-500">{settings.location}</span>
                            </div>
                        </header>

                        <div className="flex-1 overflow-y-auto p-8">
                            {/* Dashboard Stats */}
                            {activeTab === 'dashboard' && (
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                                        <div className="flex items-center gap-3 text-slate-500 mb-2">
                                            <Lucide.TrendingUp size={18} /> <span className="text-sm font-medium">Total Sales</span>
                                        </div>
                                        <p className="text-2xl font-bold">{invoices.reduce((a, b) => a + (b.total || 0), 0).toFixed(3)} {settings.currency}</p>
                                    </div>
                                    <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                                        <div className="flex items-center gap-3 text-slate-500 mb-2">
                                            <Lucide.Package size={18} /> <span className="text-sm font-medium">Inventory Items</span>
                                        </div>
                                        <p className="text-2xl font-bold">{inventory.length}</p>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'billing' && (
                                <div className="bg-white rounded-3xl shadow-xl p-8 max-w-4xl mx-auto border border-slate-100">
                                    <h2 className="text-2xl font-bold mb-6">New Invoice</h2>
                                    <p className="text-slate-500">Billing details add cheyyaan ulla advanced screen ivide load aakum.</p>
                                    {/* Billing module logic comes here */}
                                </div>
                            )}
                            
                            {activeTab === 'inventory' && (
                                <div className="space-y-4">
                                    <div className="flex justify-between items-center">
                                        <h2 className="text-2xl font-bold">Equipment List</h2>
                                        <button className="bg-blue-600 text-white px-4 py-2 rounded-lg flex items-center gap-2">
                                            <Lucide.Plus size={18} /> Add Item
                                        </button>
                                    </div>
                                    <div className="bg-white rounded-2xl border border-slate-100 overflow-hidden">
                                        <table className="w-full text-left">
                                            <thead className="bg-slate-50 border-b">
                                                <tr>
                                                    <th className="p-4 font-semibold">Item Name</th>
                                                    <th className="p-4 font-semibold">Category</th>
                                                    <th className="p-4 font-semibold">Price</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {inventory.map(item => (
                                                    <tr key={item.id} className="border-b hover:bg-slate-50">
                                                        <td className="p-4">{item.name}</td>
                                                        <td className="p-4">{item.category}</td>
                                                        <td className="p-4">{item.price} {settings.currency}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
