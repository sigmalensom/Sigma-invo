<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigma Invo - Studio Manager</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <style>
        body { background-color: #020617; color: white; font-family: sans-serif; }
        @media print { .no-print { display: none !important; } .print-only { display: block !important; color: black !important; } body { background: white; } }
        .print-only { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyB3X7v-yLpE2-tSlate-400-size", 
            authDomain: "sigma-invo.firebaseapp.com",
            projectId: "sigma-invo",
            storageBucket: "sigma-invo.appspot.com",
            messagingSenderId: "389274383502",
            appId: "1:389274383502:web:6e387c978385802"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        function App() {
            const [tab, setTab] = useState('dash');
            const [cart, setCart] = useState([]);
            const [name, setName] = useState('');
            const [phone, setPhone] = useState('');
            
            // Sample Inventory (Ithu database-il ninnu load aakum)
            const items = [
                { id: 1, name: 'Sony A7IV Rental', price: 25.000 },
                { id: 2, name: '85mm f1.4 Lens', price: 10.000 },
                { id: 3, name: 'Godox V1 Flash', price: 5.000 },
                { id: 4, name: 'Full Day Event Shoot', price: 150.000 }
            ];

            const total = cart.reduce((s, i) => s + i.price, 0);

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Sidebar/Nav */}
                    <nav className="no-print bg-slate-900 p-4 border-b border-slate-800 flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <div className="bg-blue-600 w-8 h-8 rounded flex items-center justify-center font-bold">Σ</div>
                            <span className="font-bold tracking-tighter">SIGMA STUDIO</span>
                        </div>
                        <div className="flex gap-4">
                            <button onClick={() => setTab('dash')} className={tab==='dash'?'text-blue-500 font-bold':''}>Dashboard</button>
                            <button onClick={() => setTab('bill')} className={tab==='bill'?'text-blue-500 font-bold':''}>New Bill</button>
                        </div>
                    </nav>

                    <main className="p-6 flex-1 no-print">
                        {tab === 'dash' ? (
                            <div className="max-w-4xl mx-auto space-y-6">
                                <h1 className="text-2xl font-bold">Welcome Back</h1>
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                                        <p className="text-slate-500 text-xs">STATUS</p>
                                        <p className="text-xl font-bold text-green-500">System Online</p>
                                    </div>
                                    <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                                        <p className="text-slate-500 text-xs">LOCATION</p>
                                        <p className="text-xl font-bold">Salalah, Oman</p>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8">
                                <div className="bg-slate-900 p-6 rounded-2xl">
                                    <h2 className="font-bold mb-4">Customer Info</h2>
                                    <input placeholder="Customer Name" className="w-full bg-slate-800 p-3 rounded mb-3 outline-none" onChange={e=>setName(e.target.value)} />
                                    <input placeholder="Phone" className="w-full bg-slate-800 p-3 rounded mb-6 outline-none" onChange={e=>setPhone(e.target.value)} />
                                    
                                    <h2 className="font-bold mb-4">Select Items</h2>
                                    <div className="space-y-2">
                                        {items.map(i => (
                                            <button key={i.id} onClick={() => setCart([...cart, i])} className="w-full flex justify-between bg-slate-800 p-3 rounded hover:bg-slate-700">
                                                <span>{i.name}</span>
                                                <span className="font-bold text-blue-400">{i.price.toFixed(3)}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-white text-black p-8 rounded shadow-2xl h-fit">
                                    <div className="border-b-2 pb-4 mb-4">
                                        <h2 className="text-xl font-black">SIGMA LENS STUDIO</h2>
                                        <p className="text-xs">SALALAH, OMAN</p>
                                    </div>
                                    <p className="text-xs font-bold uppercase text-slate-400">Bill To:</p>
                                    <p className="text-lg font-bold mb-4">{name || 'Cash Customer'}</p>
                                    
                                    <table className="w-full mb-6">
                                        <tr className="border-b text-xs text-slate-400"><th className="text-left py-2">Item</th><th className="text-right py-2">Rate</th></tr>
                                        {cart.map((c, idx) => (
                                            <tr key={idx} className="border-b text-sm"><td className="py-2">{c.name}</td><td className="py-2 text-right">{c.price.toFixed(3)}</td></tr>
                                        ))}
                                    </table>
                                    <div className="flex justify-between font-black text-xl">
                                        <span>TOTAL</span>
                                        <span className="text-blue-600">OMR {total.toFixed(3)}</span>
                                    </div>
                                    <button onClick={() => window.print()} className="w-full bg-black text-white p-4 rounded mt-8 font-bold">PRINT INVOICE</button>
                                    <button onClick={() => setCart([])} className="w-full text-slate-400 text-xs mt-4">Clear Cart</button>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Print Preview */}
                    <div className="print-only p-10 text-black">
                        <h1 className="text-2xl font-black">SIGMA LENS STUDIO</h1>
                        <p>Salalah, Dhofar, Oman</p>
                        <p className="mb-8 font-bold">Date: {new Date().toLocaleDateString()}</p>
                        <hr className="mb-4" />
                        <p className="font-bold">Customer: {name}</p>
                        <p className="mb-8 font-bold">Phone: {phone}</p>
                        <table className="w-full mb-8">
                            <tr className="border-b"><th className="text-left">Description</th><th className="text-right">Price</th></tr>
                            {cart.map((c, idx) => (
                                <tr key={idx} className="border-b"><td className="py-2">{c.name}</td><td className="py-2 text-right">{c.price.toFixed(3)}</td></tr>
                            ))}
                        </table>
                        <h2 className="text-2xl font-black text-right text-blue-600">TOTAL: OMR {total.toFixed(3)}</h2>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
