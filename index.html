<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigma Invo - Studio Manager</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <style>
        body { background-color: #020617; color: white; font-family: system-ui, sans-serif; overflow: hidden; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        @media print { .no-print { display: none !important; } .print-only { display: block !important; } body { background: white; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyB3X7v-yLpE2-tSlate-400-size", 
            authDomain: "sigma-invo.firebaseapp.com",
            projectId: "sigma-invo",
            storageBucket: "sigma-invo.appspot.com",
            messagingSenderId: "389274383502",
            appId: "1:389274383502:web:6e387c978385802"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();
        const auth = firebase.auth();

        function App() {
            const [tab, setTab] = useState('dashboard');
            const [inventory, setInventory] = useState([]);
            const [invoices, setInvoices] = useState([]);
            const [cart, setCart] = useState([]);
            const [client, setClient] = useState({ name: '', phone: '' });
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                auth.onAuthStateChanged(user => {
                    if (user) {
                        db.collection('inventory').onSnapshot(s => setInventory(s.docs.map(d => ({id: d.id, ...d.data()}))));
                        db.collection('invoices').onSnapshot(s => setInvoices(s.docs.map(d => ({id: d.id, ...d.data()}))));
                        setLoading(false);
                    } else { auth.signInAnonymously(); }
                });
            }, []);

            const total = cart.reduce((s, i) => s + (Number(i.price) || 0), 0);

            if (loading) return <div className="h-screen flex items-center justify-center text-blue-500 font-bold">SIGMA MANAGER INITIALIZING...</div>;

            return (
                <div className="flex h-screen">
                    {/* Sidebar */}
                    <aside className="w-64 bg-slate-900 border-r border-slate-800 flex flex-col no-print">
                        <div className="p-6 border-b border-slate-800">
                            <h1 className="font-black text-xl tracking-tighter text-blue-500 italic">SIGMA STUDIO</h1>
                        </div>
                        <nav className="flex-1 p-4 space-y-2">
                            <button onClick={() => setTab('dashboard')} className={`w-full text-left p-3 rounded-xl ${tab==='dashboard'?'bg-blue-600':'hover:bg-slate-800 text-slate-400'}`}>📊 Dashboard</button>
                            <button onClick={() => setTab('billing')} className={`w-full text-left p-3 rounded-xl ${tab==='billing'?'bg-blue-600':'hover:bg-slate-800 text-slate-400'}`}>🛒 New Bill</button>
                            <button onClick={() => setTab('inventory')} className={`w-full text-left p-3 rounded-xl ${tab==='inventory'?'bg-blue-600':'hover:bg-slate-800 text-slate-400'}`}>📦 Inventory</button>
                            <button onClick={() => setTab('history')} className={`w-full text-left p-3 rounded-xl ${tab==='history'?'bg-blue-600':'hover:bg-slate-800 text-slate-400'}`}>📜 History</button>
                        </nav>
                    </aside>

                    {/* Main */}
                    <main className="flex-1 overflow-y-auto p-8 custom-scroll no-print">
                        {tab === 'dashboard' && (
                            <div className="max-w-4xl space-y-6">
                                <h2 className="text-3xl font-black italic">Sigma Dashboard</h2>
                                <div className="grid grid-cols-2 gap-6">
                                    <div className="bg-slate-900 p-8 rounded-3xl border border-slate-800 shadow-xl">
                                        <p className="text-xs text-slate-500 font-bold uppercase">Revenue</p>
                                        <h3 className="text-3xl font-black mt-2 text-white">{invoices.reduce((a,b)=>a+(b.total||0),0).toFixed(3)} OMR</h3>
                                    </div>
                                    <div className="bg-slate-900 p-8 rounded-3xl border border-slate-800 shadow-xl">
                                        <p className="text-xs text-slate-500 font-bold uppercase">Items</p>
                                        <h3 className="text-3xl font-black mt-2 text-white">{inventory.length} Gear</h3>
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === 'inventory' && (
                            <div className="bg-slate-900 rounded-3xl border border-slate-800 overflow-hidden shadow-2xl">
                                <div className="p-6 border-b border-slate-800 flex justify-between items-center">
                                    <h3 className="font-bold">Equipment List</h3>
                                    <button className="bg-blue-600 px-4 py-2 rounded-lg text-sm font-bold">+ Add Gear</button>
                                </div>
                                <table className="w-full text-left">
                                    <thead className="bg-slate-800/50 text-xs text-slate-400">
                                        <tr><th className="p-6">Description</th><th className="p-6 text-right">Price</th></tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-800">
                                        {inventory.map(i => (
                                            <tr key={i.id} className="hover:bg-slate-800/20">
                                                <td className="p-6 font-bold">{i.name}</td>
                                                <td className="p-6 text-right font-bold text-blue-400">{i.price}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {tab === 'billing' && (
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
                                <div className="space-y-6">
                                    <div className="bg-slate-900 p-8 rounded-[2.5rem] border border-slate-800 shadow-xl">
                                        <p className="text-blue-500 font-bold text-xs mb-4 uppercase tracking-widest">Client</p>
                                        <input placeholder="Customer Name" className="w-full bg-slate-950 border border-slate-800 p-4 rounded-2xl mb-4" onChange={(e)=>setClient({...client, name: e.target.value})} />
                                        <input placeholder="Phone Number" className="w-full bg-slate-950 border border-slate-800 p-4 rounded-2xl" onChange={(e)=>setClient({...client, phone: e.target.value})} />
                                    </div>
                                    <div className="bg-slate-900 p-8 rounded-[2.5rem] border border-slate-800 h-96 overflow-y-auto custom-scroll">
                                        <p className="text-purple-500 font-bold text-xs mb-4 uppercase tracking-widest">Gear Selection</p>
                                        {inventory.map(item => (
                                            <button key={item.id} onClick={()=>setCart([...cart, {...item, cid:Date.now()}])} className="w-full flex justify-between p-4 mb-2 bg-slate-950 rounded-2xl border border-slate-800 hover:border-blue-600">
                                                <span>{item.name}</span><span className="font-bold text-blue-400">{item.price}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-white text-slate-900 p-10 rounded-[3rem] shadow-2xl h-fit border border-slate-100">
                                    <div className="flex justify-between border-b-2 border-slate-100 pb-8 mb-8">
                                        <h1 className="text-2xl font-black italic">SIGMA STUDIO</h1>
                                        <div className="text-right font-bold text-slate-300">INVOICE</div>
                                    </div>
                                    <div className="mb-8 font-bold">
                                        <p className="text-[10px] text-slate-400 uppercase">Customer:</p>
                                        <p className="text-xl uppercase">{client.name || 'Cash Customer'}</p>
                                    </div>
                                    <table className="w-full mb-8">
                                        <tr className="border-b text-[10px] text-slate-400 uppercase font-bold text-left"><th className="pb-2">Description</th><th className="pb-2 text-right">Price</th></tr>
                                        {cart.map((c,i)=>(<tr key={i} className="border-b"><td className="py-4 font-bold text-slate-700">{c.name}</td><td className="py-4 text-right font-bold">{c.price}</td></tr>))}
                                    </table>
                                    <div className="flex justify-between items-center pt-8 border-t-2 border-slate-100">
                                        <span className="font-bold text-slate-400">TOTAL OMR</span>
                                        <span className="text-4xl font-black text-blue-600">{total.toFixed(3)}</span>
                                    </div>
                                    <button onClick={()=>window.print()} className="w-full mt-10 bg-slate-900 text-white py-5 rounded-2xl font-bold uppercase hover:bg-blue-600 transition shadow-xl">Print Official Bill</button>
                                    <button onClick={()=>setCart([])} className="w-full text-xs text-slate-300 mt-4">Clear All Items</button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
