<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigma Invo - Professional Studio Manager</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { background-color: #020617; color: white; font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-sidebar { background: #0f172a; border-right: 1px solid #1e293b; }
        .nav-btn { transition: all 0.2s; border-radius: 12px; margin-bottom: 4px; display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 16px; font-weight: 600; font-size: 14px; }
        .nav-btn:hover { background: #1e293b; }
        .nav-active { background: #2563eb !important; color: white !important; }
        @media print { .no-print { display: none !important; } body { background: white; color: black; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyB3X7v-yLpE2-tSlate-400-size", 
            authDomain: "sigma-invo.firebaseapp.com",
            projectId: "sigma-invo",
            storageBucket: "sigma-invo.appspot.com",
            messagingSenderId: "389274383502",
            appId: "1:389274383502:web:6e387c978385802"
        };

        // Safety check for Firebase
        try {
            if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        } catch (e) { console.error("Firebase Init Error", e); }
        
        const db = firebase.firestore();
        const auth = firebase.auth();

        function App() {
            const [tab, setTab] = useState('dash');
            const [inventory, setInventory] = useState([]);
            const [cart, setCart] = useState([]);
            const [client, setClient] = useState({ name: '', phone: '' });
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const unsubAuth = auth.onAuthStateChanged(user => {
                    if (user) {
                        const unsubInv = db.collection('inventory').onSnapshot(s => {
                            setInventory(s.docs.map(d => ({id: d.id, ...d.data()})));
                            setLoading(false);
                        }, err => {
                            console.error("Firestore Error", err);
                            setLoading(false); // Stop loading even on error
                        });
                        return () => unsubInv();
                    } else {
                        auth.signInAnonymously().catch(e => console.error("Auth Error", e));
                    }
                });
                return () => unsubAuth();
            }, []);

            const total = cart.reduce((s, i) => s + (Number(i.price) || 0), 0);

            if (loading) return (
                <div className="h-screen flex flex-col items-center justify-center bg-[#020617]">
                    <div className="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                    <p className="mt-4 text-slate-500 font-bold uppercase tracking-widest text-[10px]">Initializing Sigma Systems</p>
                </div>
            );

            return (
                <div className="flex h-screen">
                    {/* Sidebar */}
                    <aside className="w-64 glass-sidebar p-6 flex flex-col no-print">
                        <div className="mb-10 px-2 flex items-center gap-3">
                            <div className="bg-blue-600 h-8 w-8 rounded-lg flex items-center justify-center font-bold">Σ</div>
                            <h1 className="text-xl font-black italic tracking-tighter">SIGMA INVO</h1>
                        </div>
                        <nav className="flex-1">
                            <button onClick={()=>setTab('dash')} className={`nav-btn ${tab==='dash'?'nav-active':'text-slate-400'}`}>📊 Dashboard</button>
                            <button onClick={()=>setTab('bill')} className={`nav-btn ${tab==='bill'?'nav-active':'text-slate-400'}`}>🛒 New Bill</button>
                            <button onClick={()=>setTab('inv')} className={`nav-btn ${tab==='inv'?'nav-active':'text-slate-400'}`}>📦 Inventory</button>
                        </nav>
                        <div className="mt-auto pt-6 border-t border-slate-800">
                            <p className="text-[10px] font-bold text-slate-600 uppercase tracking-widest text-center">Salalah, Oman</p>
                        </div>
                    </aside>

                    {/* Content */}
                    <main className="flex-1 p-10 overflow-y-auto no-print">
                        {tab === 'dash' && (
                            <div className="max-w-4xl space-y-8">
                                <h2 className="text-4xl font-black tracking-tight italic">Studio Hub</h2>
                                <div className="grid grid-cols-2 gap-6">
                                    <div className="bg-slate-900 p-10 rounded-[2rem] border border-slate-800 shadow-xl">
                                        <p className="text-blue-500 text-xs font-bold uppercase mb-2">Inventory Gear</p>
                                        <p className="text-5xl font-black">{inventory.length}</p>
                                    </div>
                                    <div className="bg-slate-900 p-10 rounded-[2rem] border border-slate-800 shadow-xl">
                                        <p className="text-green-500 text-xs font-bold uppercase mb-2">Location Status</p>
                                        <p className="text-3xl font-black">Salalah Active</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === 'inv' && (
                            <div className="max-w-4xl bg-slate-900 rounded-[2rem] border border-slate-800 overflow-hidden shadow-2xl">
                                <table className="w-full text-left">
                                    <thead className="bg-slate-800/50 text-[10px] uppercase font-bold text-slate-500">
                                        <tr><th className="p-6">Equipment Description</th><th className="p-6 text-right">Price OMR</th></tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-800">
                                        {inventory.length > 0 ? inventory.map(i => (
                                            <tr key={i.id} className="hover:bg-slate-800/30 transition">
                                                <td className="p-6 font-bold">{i.name}</td>
                                                <td className="p-6 text-right font-black text-blue-400 tracking-tight">{Number(i.price).toFixed(3)}</td>
                                            </tr>
                                        )) : (
                                            <tr><td colSpan="2" className="p-10 text-center text-slate-500 font-bold uppercase text-xs">No Gear Added Yet</td></tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {tab === 'bill' && (
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
                                <div className="space-y-6">
                                    <div className="bg-slate-900 p-8 rounded-[2.5rem] border border-slate-800 shadow-lg">
                                        <p className="text-blue-500 font-bold text-[10px] uppercase mb-4">Client Detail</p>
                                        <input placeholder="Customer Name" className="w-full bg-slate-950 border border-slate-800 p-4 rounded-2xl mb-4 outline-none" onChange={e=>setClient({...client, name:e.target.value})} />
                                        <input placeholder="Contact No" className="w-full bg-slate-950 border border-slate-800 p-4 rounded-2xl outline-none" onChange={e=>setClient({...client, phone:e.target.value})} />
                                    </div>
                                    <div className="bg-slate-900 p-8 rounded-[2.5rem] border border-slate-800 h-96 overflow-y-auto">
                                        <p className="text-purple-500 font-bold text-[10px] uppercase mb-4">Select Items</p>
                                        {inventory.map(item => (
                                            <button key={item.id} onClick={()=>setCart([...cart, {...item, cid:Date.now()}])} className="w-full flex justify-between p-4 mb-2 bg-slate-950 rounded-xl border border-slate-800 hover:border-blue-600 transition text-left">
                                                <span className="font-bold text-sm">{item.name}</span>
                                                <span className="text-blue-400 font-bold">{Number(item.price).toFixed(3)}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-white text-slate-950 p-10 rounded-[3rem] shadow-2xl h-fit">
                                    <div className="flex justify-between border-b-2 border-slate-100 pb-8 mb-8">
                                        <div><h1 className="text-2xl font-black tracking-tighter">SIGMA LENS</h1><p className="text-[9px] text-slate-400 font-bold uppercase tracking-widest">Studio & Rentals, Oman</p></div>
                                        <div className="text-right"><h2 className="text-4xl font-black text-slate-100 tracking-tighter mb-1">BILL</h2><p className="text-[10px] font-bold text-slate-400">{new Date().toLocaleDateString()}</p></div>
                                    </div>
                                    <div className="mb-8"><p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">Bill To:</p><p className="text-xl font-black uppercase">{client.name || 'Cash Customer'}</p></div>
                                    <table className="w-full mb-8">
                                        <thead><tr className="border-b text-[10px] text-slate-400 font-bold uppercase"><th className="pb-2 text-left">Item</th><th className="pb-2 text-right">Rate</th></tr></thead>
                                        <tbody>
                                            {cart.map((c,i)=>(<tr key={i} className="border-b border-slate-50"><td className="py-4 font-bold text-slate-700">{c.name}</td><td className="py-4 text-right font-bold">{Number(c.price).toFixed(3)}</td></tr>))}
                                        </tbody>
                                    </table>
                                    <div className="flex justify-between items-center pt-8 border-t-2 border-slate-50">
                                        <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Total OMR</span>
                                        <span className="text-4xl font-black text-blue-600 tracking-tighter">{total.toFixed(3)}</span>
                                    </div>
                                    <button onClick={()=>window.print()} className="w-full mt-10 bg-slate-900 text-white py-5 rounded-2xl font-black uppercase tracking-widest hover:bg-blue-600 transition shadow-xl no-print">Generate Bill</button>
                                    <button onClick={()=>setCart([])} className="w-full mt-4 text-[10px] text-slate-300 font-bold uppercase no-print tracking-widest">Reset</button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
