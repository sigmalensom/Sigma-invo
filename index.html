<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigma Invo - Professional Studio Manager</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { background-color: #020617; color: white; font-family: 'Plus Jakarta Sans', sans-serif; }
        .sidebar-item { transition: all 0.2s; }
        .sidebar-item:hover { background: #1e293b; color: #3b82f6; }
        .active-tab { background: #2563eb !important; color: white !important; box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.4); }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border: 1px border rgba(30, 41, 59, 1); }
        @media print { .no-print { display: none !important; } .print-area { display: block !important; } body { background: white; color: black; } }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyB3X7v-yLpE2-tSlate-400-size", 
            authDomain: "sigma-invo.firebaseapp.com",
            projectId: "sigma-invo",
            storageBucket: "sigma-invo.appspot.com",
            messagingSenderId: "389274383502",
            appId: "1:389274383502:web:6e387c978385802"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();
        const auth = firebase.auth();

        function App() {
            const [tab, setTab] = useState('dashboard');
            const [inventory, setInventory] = useState([]);
            const [cart, setCart] = useState([]);
            const [customer, setCustomer] = useState({ name: '', phone: '' });
            const [loading, setLoading] = useState(true);
            const [newItem, setNewItem] = useState({ name: '', price: '' });

            useEffect(() => {
                auth.onAuthStateChanged(user => {
                    if (user) {
                        db.collection('inventory').onSnapshot(s => setInventory(s.docs.map(d => ({id: d.id, ...d.data()}))));
                        setLoading(false);
                    } else { auth.signInAnonymously(); }
                });
            }, []);

            const addToInv = () => {
                if(newItem.name && newItem.price) {
                    db.collection('inventory').add({ name: newItem.name, price: parseFloat(newItem.price) });
                    setNewItem({ name: '', price: '' });
                }
            };

            const total = cart.reduce((s, i) => s + i.price, 0);

            if (loading) return <div className="h-screen flex items-center justify-center font-bold text-blue-500 bg-slate-950 italic">SIGMA MANAGER...</div>;

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* Sidebar - EXACT DESIGN */}
                    <aside className="w-72 bg-slate-900 border-r border-slate-800 flex flex-col no-print">
                        <div className="p-8 border-b border-slate-800">
                            <div className="flex items-center gap-3">
                                <div className="bg-blue-600 p-2 rounded-xl shadow-lg shadow-blue-600/20">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                                </div>
                                <h1 className="text-xl font-extrabold tracking-tighter italic">SIGMA INVO</h1>
                            </div>
                        </div>
                        <nav className="flex-1 p-6 space-y-3">
                            <button onClick={()=>setTab('dashboard')} className={`w-full flex items-center gap-4 px-5 py-4 rounded-2xl font-semibold sidebar-item ${tab==='dashboard'?'active-tab':''}`}>
                                <span>Dashboard</span>
                            </button>
                            <button onClick={()=>setTab('billing')} className={`w-full flex items-center gap-4 px-5 py-4 rounded-2xl font-semibold sidebar-item ${tab==='billing'?'active-tab':''}`}>
                                <span>New Bill</span>
                            </button>
                            <button onClick={()=>setTab('inventory')} className={`w-full flex items-center gap-4 px-5 py-4 rounded-2xl font-semibold sidebar-item ${tab==='inventory'?'active-tab':''}`}>
                                <span>Inventory</span>
                            </button>
                        </nav>
                        <div className="p-6 border-t border-slate-800">
                            <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800">
                                <p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Location</p>
                                <p className="text-sm font-bold">Salalah, Oman</p>
                            </div>
                        </div>
                    </aside>

                    {/* Main Area */}
                    <main className="flex-1 overflow-y-auto p-10 custom-scroll no-print bg-slate-950">
                        {tab === 'dashboard' && (
                            <div className="space-y-8 animate-in fade-in duration-500">
                                <div className="flex justify-between items-end">
                                    <div>
                                        <h2 className="text-4xl font-extrabold tracking-tight">Studio Overview</h2>
                                        <p className="text-slate-500 mt-1 font-medium">Welcome back to your studio management.</p>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                    <div className="bg-slate-900 p-10 rounded-[2.5rem] border border-slate-800 shadow-2xl relative overflow-hidden group">
                                        <div className="absolute top-0 right-0 p-8 opacity-10 group-hover:scale-110 transition">📦</div>
                                        <p className="text-blue-500 text-xs font-black uppercase tracking-[0.2em] mb-4">Total Equipment</p>
                                        <h3 className="text-5xl font-black">{inventory.length}</h3>
                                        <p className="text-slate-500 mt-4 text-sm font-bold">Gear items available in inventory</p>
                                    </div>
                                    <div className="bg-slate-900 p-10 rounded-[2.5rem] border border-slate-800 shadow-2xl relative overflow-hidden group">
                                        <div className="absolute top-0 right-0 p-8 opacity-10 group-hover:scale-110 transition">✨</div>
                                        <p className="text-purple-500 text-xs font-black uppercase tracking-[0.2em] mb-4">Clinic Status</p>
                                        <h3 className="text-5xl font-black uppercase">Active</h3>
                                        <p className="text-slate-500 mt-4 text-sm font-bold">Punarnavi Clinic is operational</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === 'inventory' && (
                            <div className="max-w-4xl space-y-6">
                                <div className="bg-slate-900 p-8 rounded-[2rem] border border-slate-800 flex gap-4">
                                    <input placeholder="Item Name (e.g. Sony A7IV)" className="flex-1 bg-slate-950 border border-slate-800 p-4 rounded-2xl outline-none focus:border-blue-600 transition" value={newItem.name} onChange={e=>setNewItem({...newItem, name:e.target.value})} />
                                    <input placeholder="Price" className="w-32 bg-slate-950 border border-slate-800 p-4 rounded-2xl outline-none" value={newItem.price} onChange={e=>setNewItem({...newItem, price:e.target.value})} />
                                    <button onClick={addToInv} className="bg-blue-600 px-10 rounded-2xl font-black uppercase text-xs tracking-widest hover:bg-blue-700">Add Gear</button>
                                </div>
                                <div className="bg-slate-900 rounded-[2rem] border border-slate-800 overflow-hidden shadow-2xl">
                                    <table className="w-full text-left">
                                        <thead className="bg-slate-800/50 text-slate-500 text-[10px] uppercase font-black tracking-widest">
                                            <tr><th className="p-8">Description</th><th className="p-8 text-right">Rental Rate (OMR)</th></tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-800">
                                            {inventory.map(i => (
                                                <tr key={i.id} className="hover:bg-slate-800/30 transition">
                                                    <td className="p-8 font-extrabold">{i.name}</td>
                                                    <td className="p-8 text-right font-black text-blue-400 text-lg">{i.price.toFixed(3)}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {tab === 'billing' && (
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-10 max-w-[1400px]">
                                <div className="space-y-6">
                                    <div className="bg-slate-900 p-10 rounded-[3rem] border border-slate-800">
                                        <h3 className="text-blue-500 font-black text-xs uppercase tracking-widest mb-6">Customer Information</h3>
                                        <div className="space-y-4">
                                            <input placeholder="Client Full Name" className="w-full bg-slate-950 border border-slate-800 p-5 rounded-3xl outline-none" onChange={e=>setCustomer({...customer, name:e.target.value})} />
                                            <input placeholder="Phone / WhatsApp" className="w-full bg-slate-950 border border-slate-800 p-5 rounded-3xl outline-none" onChange={e=>setCustomer({...customer, phone:e.target.value})} />
                                        </div>
                                    </div>
                                    <div className="bg-slate-900 p-10 rounded-[3rem] border border-slate-800 h-[450px] overflow-y-auto custom-scroll">
                                        <h3 className="text-purple-500 font-black text-xs uppercase tracking-widest mb-6">Available Gear</h3>
                                        {inventory.map(item => (
                                            <button key={item.id} onClick={()=>setCart([...cart, {...item, cid:Date.now()}])} className="w-full flex justify-between items-center p-5 mb-3 bg-slate-950 rounded-3xl border border-slate-800 hover:border-blue-600 transition text-left group">
                                                <div>
                                                    <p className="font-bold text-sm group-hover:text-blue-400">{item.name}</p>
                                                    <p className="text-[10px] text-slate-500 font-bold uppercase">Rental</p>
                                                </div>
                                                <p className="font-black text-blue-400">{item.price.toFixed(3)}</p>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* A4 PREVIEW */}
                                <div className="bg-white text-slate-900 p-12 rounded-[3.5rem] shadow-2xl h-fit border border-slate-100">
                                    <div className="flex justify-between border-b-4 border-slate-50 pb-10 mb-10">
                                        <div>
                                            <h1 className="text-3xl font-black italic tracking-tighter">SIGMA LENS STUDIO</h1>
                                            <p className="text-[10px] text-slate-400 font-black uppercase tracking-[0.2em] mt-1">Salalah, Sultanate of Oman</p>
                                        </div>
                                        <div className="text-right">
                                            <h2 className="text-4xl font-black text-slate-100 tracking-tighter mb-1">INVOICE</h2>
                                            <p className="text-xs font-bold text-slate-400 uppercase tracking-widest">{new Date().toLocaleDateString()}</p>
                                        </div>
                                    </div>
                                    <div className="mb-10">
                                        <p className="text-[10px] font-black text-slate-300 uppercase tracking-[0.2em] mb-2">Billed To:</p>
                                        <p className="text-2xl font-black uppercase tracking-tight">{customer.name || 'Walk-in Client'}</p>
                                        <p className="text-sm font-bold text-slate-400">{customer.phone}</p>
                                    </div>
                                    <table className="w-full mb-12">
                                        <thead><tr className="border-b-2 border-slate-50 text-[10px] text-slate-400 font-black uppercase tracking-widest"><th className="py-5 text-left">Description</th><th className="py-5 text-right">Total (OMR)</th></tr></thead>
                                        <tbody>
                                            {cart.map((c,i)=>(<tr key={i} className="border-b border-slate-50"><td className="py-5 font-bold text-slate-700">{c.name}</td><td className="py-5 text-right font-black text-slate-950">{c.price.toFixed(3)}</td></tr>))}
                                        </tbody>
                                    </table>
                                    <div className="flex justify-between items-center border-t-4 border-slate-50 pt-10">
                                        <span className="text-xs font-black text-slate-300 uppercase tracking-[0.3em]">Grand Total</span>
                                        <span className="text-5xl font-black text-blue-600 tracking-tighter">{total.toFixed(3)}</span>
                                    </div>
                                    <button onClick={()=>window.print()} className="w-full mt-12 bg-slate-900 text-white py-6 rounded-[2rem] font-black uppercase tracking-[0.2em] hover:bg-blue-600 transition-all shadow-xl shadow-slate-900/20 no-print">Print Official Invoice</button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
